name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit & integration tests (with coverage)
        run: npm run test:coverage -- --ci

      - name: Build
        run: npm run build

      - name: Smoke test (no external network dependency)
        run: |
          PORT=4123 node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:4123/ -o /dev/null; then break; fi
            sleep 1
          done

          echo "--- static UI ---"
          curl -sf -o /dev/null http://localhost:4123/

          echo "--- POST /api/sequence/process without required fields returns 400 ---"
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4123/api/sequence/process \
            -H "Content-Type: application/json" -d '{}')
          test "$status" = "400"

          echo "--- CORS preflight exposes Access-Control-Allow-Origin ---"
          curl -s -i -X OPTIONS http://localhost:4123/api/sequence/process \
            -H "Origin: http://localhost:5500" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | grep -qi "Access-Control-Allow-Origin"

          kill $SERVER_PID

  file-issue-on-failure:
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update a GitHub issue for the CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const label = "ci-failure";
            const shortSha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI failed on ${context.ref} (${shortSha})`;
            const body = [
              `The CI pipeline failed on \`${context.ref}\` at commit ${context.sha}.`,
              "",
              `**Workflow run:** ${runUrl}`,
              `**Event:** ${context.eventName} (triggered by @${context.actor})`,
              "",
              "Check the run logs above for the failing step (lint, type-check, tests, build, or smoke test).",
            ].join("\n");

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body: `Another CI failure occurred.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
